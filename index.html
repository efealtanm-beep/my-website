<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWARM — one prompt, five workers</title>
    <meta
      name="description"
      content="Swarm launches tokens with five AI workers: a deployer, a meme engine, a community operator, a market maker, and SwarmCore running the whole colony. One prompt, five autonomous agents on Solana."
    />
    <script>
      // Set theme before first paint so there is no flash. Light is the default.
      try {
        var t = localStorage.getItem('swarm-theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ECEAE0'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231D33C8'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ECEAE0'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fragment+Mono:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
